<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Agriculturist - Mehedi Alim Ayon</title>

<style>

/* =========================================================
   GLOBAL
========================================================= */

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;

    /* IMPORTANT:
       NO PURE BLACK / NO PURE WHITE */
    background:
        radial-gradient(circle at top right, #9a481b 0%, transparent 32%),
        radial-gradient(circle at bottom left, #713416 0%, transparent 30%),
        linear-gradient(135deg,#321b12,#522713,#3b2116);

    color:#f8eee6;
    line-height:1.7;
    min-height:100vh;
}

/* =========================================================
   MAIN CONTAINER
========================================================= */

.container{
    width:100%;
    max-width:1100px;
    margin:0 auto;
    padding:28px 22px 50px;
}

/* =========================================================
   TOP HEADER
========================================================= */

.hero{
    background:
        linear-gradient(135deg,
        rgba(255,255,255,0.97),
        rgba(255,244,232,0.96));

    color:#2b1a12;

    padding:38px 35px;
    border-radius:0 0 35px 35px;

    box-shadow:
        0 15px 40px rgba(0,0,0,0.25);

    margin-bottom:40px;

    position:relative;
    overflow:hidden;
}

.hero::after{
    content:"";
    position:absolute;
    width:220px;
    height:220px;
    right:-80px;
    top:-80px;

    background:#ff7414;
    opacity:.12;

    border-radius:50%;
}

.hero-label{
    color:#d95d0b;
    font-size:.75rem;
    font-weight:800;
    letter-spacing:4px;
    text-transform:uppercase;

    margin-bottom:10px;
}

.hero-title{
    font-size:clamp(2.2rem,6vw,4rem);
    line-height:1.05;
    font-weight:900;

    margin:0;
}

.hero-title span{
    color:#e7650d;
}

.hero-line{
    width:60px;
    height:4px;
    background:#ff7414;
    border-radius:10px;
    margin:22px 0;
}

.hero-description{
    color:#6b625d;
    font-size:1rem;
    max-width:850px;
    margin:0;
}

/* =========================================================
   LOGO
========================================================= */

.logo-wrap{
    display:flex;
    justify-content:center;
    margin-bottom:25px;
}

.logo-container{
    display:inline-flex;
    align-items:center;
    justify-content:center;

    background:
        linear-gradient(135deg,#f47a1b,#c94d08);

    padding:13px 28px;

    border-radius:16px;

    box-shadow:
        0 10px 30px rgba(0,0,0,.28),
        0 0 25px rgba(255,116,20,.18);
}

.logo{
    width:240px;
    max-width:100%;
    height:auto;
    display:block;
}

/* =========================================================
   DESIGNATION
========================================================= */

.designation{
    text-align:center;
    color:#ffd8bd;

    font-size:1.05rem;
    font-weight:700;

    margin:0 auto 35px;

    letter-spacing:.5px;
}

.designation span{
    color:#ff8a3d;
}

/* =========================================================
   SECTION
========================================================= */

.section{
    margin-bottom:38px;
}

.section-label{
    color:#ff9a58;

    font-size:.72rem;
    font-weight:800;

    letter-spacing:3px;
    text-transform:uppercase;

    margin-bottom:8px;
}

.section-title{
    color:#fff2e8;

    font-size:clamp(1.8rem,4vw,2.7rem);

    line-height:1.15;

    margin:0 0 22px;

    font-weight:900;
}

.section-title span{
    color:#ff7b25;
}

/* =========================================================
   CONTENT CARDS
========================================================= */

.content-box{
    position:relative;

    background:
        linear-gradient(145deg,
        rgba(91,45,24,.98),
        rgba(57,29,17,.98));

    border:1px solid rgba(255,116,20,.45);

    border-radius:22px;

    padding:30px 32px;

    margin-bottom:22px;

    box-shadow:
        0 12px 30px rgba(0,0,0,.20);

    overflow:hidden;
}

.content-box::after{
    content:"";

    position:absolute;

    width:150px;
    height:150px;

    right:-65px;
    top:-65px;

    border-radius:50%;

    background:#ff7414;

    opacity:.08;
}

.content-box
