<html lang="en">
<head>

<title>Agriculturist - Mehedi Alim Ayon</title>

<style>

/* =========================================================
   MAIN THEME
   BLACK + ORANGE PREMIUM PORTFOLIO
========================================================= */

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    padding:0;
    font-family:Arial, Helvetica, sans-serif;

    background:
        radial-gradient(circle at top right, rgba(255,116,20,0.18), transparent 35%),
        radial-gradient(circle at bottom left, rgba(255,116,20,0.10), transparent 30%),
        #15110f;

    color:#f5f5f5;
    line-height:1.7;
}

/* MAIN CONTAINER */

.container{
    width:100%;
    max-width:1100px;
    margin:0 auto;
    padding:30px 22px 50px;
}

/* =========================================================
   TOP HEADER
========================================================= */

.page-header{
    text-align:center;
    padding:42px 25px;
    margin-bottom:28px;

    background:
        linear-gradient(
            135deg,
            rgba(255,116,20,0.20),
            rgba(35,27,23,0.96)
        );

    border:1px solid rgba(255,116,20,0.45);
    border-radius:28px;

    box-shadow:
        0 15px 45px rgba(0,0,0,0.35),
        inset 0 1px 0 rgba(255,255,255,0.05);
}

/* LOGO */

.logo-box{
    width:150px;
    height:150px;
    margin:0 auto 25px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            #2c211b 0%,
            #1c1512 65%,
            #120e0c 100%
        );

    border:3px solid #ff7414;

    box-shadow:
        0 0 0 7px rgba(255,116,20,0.08),
        0 0 35px rgba(255,116,20,0.22);
}

.logo{
    width:105px;
    height:105px;
    object-fit:contain;
}

/* TITLE */

.page-title{
    margin:0;

    color:#ff7414;

    font-size:clamp(2rem,5vw,3.5rem);

    font-weight:900;
    letter-spacing:1px;

    text-transform:uppercase;
}

.page-subtitle{
    margin:12px 0 0;

    color:#e8d8cd;

    font-size:1.15rem;

    letter-spacing:.5px;
}

/* ORANGE LINE */

.orange-line{
    width:75px;
    height:4px;

    background:#ff7414;

    border-radius:10px;

    margin:22px auto 0;

    box-shadow:0 0 15px rgba(255,116,20,0.35);
}

/* =========================================================
   CONTENT CARDS
========================================================= */

.content-box{

    position:relative;

    margin-bottom:25px;
    padding:32px 34px;

    background:
        linear-gradient(
            145deg,
            #28201c,
            #211a17
        );

    border:1px solid rgba(255,116,20,0.28);

    border-radius:22px;

    box-shadow:
        0 12px 35px rgba(0,0,0,0.28),
        inset 0 1px 0 rgba(255,255,255,0.035);

    overflow:hidden;
}

/* SMALL ORANGE ACCENT */

.content-box::before{
    content:"";

    position:absolute;

    top:0;
    left:0;

    width:5px;
    height:100%;

    background:#ff7414;
}

/* HEADINGS */

.content-box h2{

    margin:0 0 20px;

    padding-left:4px;

    color:#ff7414;

    font-size:1.75rem;

    line-height:1.3;

    font-weight:800;
}

/* PARAGRAPHS */

.content-box p{

    margin:0 0 18px;

    color:#ddd2cb;

    font-size:1.05rem;

    line-height:1.85;
}

.content-box p:last-child{
    margin-bottom:0;
}

/* STRONG */

strong{
    color:#ff7414;
    font-weight:800;
}

/* =========================================================
   HIGHLIGHT
========================================================= */

.highlight{
    color:#ff7414;
    font-weight:800;
}

/* =========================================================
   BACK BUTTON
========================================================= */

.back-btn{

    display:block;

    width:100%;

    margin-top:35px;

    padding:17px 20px;

    text-align:center;

    text-decoration:none;

    color:#ffffff;

    font-size:1.05rem;

    font-weight:800;

    letter-spacing:.5px;

    background:
        linear-gradient(
            135deg,
            #ff7414,
            #e85f08
        );

    border:1px solid #ff7414;

    border-radius:14px;

    box-shadow:
        0 10px 25px rgba(255,116,20,0.22);

    transition:.3s ease;
}

.back-btn:hover{
    transform:translateY(-2px);

    box-shadow:
        0 14px 30px rgba(255,116,20,0.35);
}

/* =========================================================
   MOBILE
========================================================= */
