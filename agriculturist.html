<html lang="en">
<head>

<style>

/* =========================================================
   RESET & GLOBAL
========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    padding: 0;
    min-height: 100vh;

    font-family: Arial, Helvetica, sans-serif;

    color: #f5f5f5;

    background:
        radial-gradient(
            circle at top right,
            rgba(255,116,20,0.16),
            transparent 35%
        ),
        radial-gradient(
            circle at bottom left,
            rgba(255,116,20,0.08),
            transparent 35%
        ),
        linear-gradient(
            135deg,
            #171717 0%,
            #101010 50%,
            #181818 100%
        );

    line-height: 1.7;
}


/* =========================================================
   MAIN CONTAINER
========================================================= */

.container {
    width: 100%;
    max-width: 1050px;
    margin: 0 auto;
    padding: 28px 22px 60px;
}


/* =========================================================
   BAU LOGO
========================================================= */

.logo-container {
    position: relative;
    overflow: hidden;

    width: 100%;
    max-width: 440px;

    margin: 0 auto 35px;

    padding: 20px 25px;

    text-align: center;

    background:
        linear-gradient(
            135deg,
            #ff7414,
            #e85f00
        );

    border-radius: 22px;

    border: 1px solid rgba(255,255,255,0.15);

    box-shadow:
        0 15px 35px rgba(0,0,0,0.35),
        0 8px 25px rgba(255,116,20,0.18);
}


.logo-container::after {
    content: "";

    position: absolute;

    width: 150px;
    height: 150px;

    right: -60px;
    top: -60px;

    border-radius: 50%;

    background: rgba(255,255,255,0.10);

    pointer-events: none;
}


.logo {
    position: relative;
    z-index: 2;

    display: block;

    width: 100%;
    max-width: 320px;

    height: auto;

    margin: 0 auto;

    object-fit: contain;
}


/* =========================================================
   DESIGNATION
========================================================= */

.designation-header {

    text-align: center;

    color: #ffffff;

    font-size: clamp(
        1.15rem,
        3vw,
        1.75rem
    );

    font-weight: 800;

    line-height: 1.5;

    letter-spacing: 0.5px;

    margin-bottom: 42px;
}


.designation-header .orange {
    color: #ff7414;
}


/* =========================================================
   CONTENT CARDS
========================================================= */

.content-box {

    position: relative;

    background:
        linear-gradient(
            145deg,
            #242424 0%,
            #191919 100%
        );

    border: 1px solid rgba(255,255,255,0.08);

    border-left: 4px solid #ff7414;

    border-radius: 20px;

    padding: 35px 38px;

    margin-bottom: 28px;

    box-shadow:
        0 15px 35px rgba(0,0,0,0.32);

    transition: 0.3s ease;
}


.content-box:hover {

    transform: translateY(-3px);

    border-color: rgba(255,116,20,0.45);

    box-shadow:
        0 20px 45px rgba(0,0,0,0.42);
}


/* =========================================================
   HEADINGS
========================================================= */

h2 {

    color: #ffffff;

    font-size: 1.65rem;

    line-height: 1.35;

    margin-bottom: 24px;

    padding-left: 15px;

    border-left: 4px solid #ff7414;
}


/* =========================================================
   PARAGRAPHS
========================================================= */

p {

    color: #cfcfcf;

    font-size: 1rem;

    line-height: 1.85;

    margin-bottom: 20px;

    letter-spacing: 0.15px;
}


p:last-child {
    margin-bottom: 0;
}


/* =========================================================
   HIGHLIGHT
========================================================= */

.highlight {

    color: #ff7414;

    font-weight: 700;
}


/* =========================================================
   STRONG TEXT
========================================================= */

strong {
    color: #ffffff;
}


/* =========================================================
   BACK BUTTON
========================================================= */

.back-btn {

    display: block;

    width: 100%;

    text-align: center;

    margin-top: 35px;

    padding: 17px 20px;

    background:
        linear-gradient(
            135deg,
            #ff7414,
            #e85f00
        );

    border: none;

    border-radius: 12px;

    color: #ffffff;

    text-decoration: none;

    font-weight: 800;

    font-size: 0.95rem;

    letter-spacing: 0.5px;

    box-shadow:
        0 10px 25px rgba(255,116,20,0.25);

    transition: 0.3s ease;
}


.back-btn:hover {

    transform: translateY(-2px);

    box-shadow:
        0 15px 30px rgba(255,116,20,0.35);
}

   MOBILE
========================================================= */

    }

        font-size: 0.88rem;

        line-height: 1.75;

        margin-bottom: 17px;
    }


    .back-btn {

        font-size: 0.85rem;

        padding: 15px;
    }

}
