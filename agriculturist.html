<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Agriculturist - Mehedi Alim Ayon</title>

<style>

/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    padding: 0;
    min-height: 100vh;

    font-family: Arial, Helvetica, sans-serif;

    color: #f5f5f5;

    background:
        radial-gradient(circle at top right, rgba(255,116,20,0.16), transparent 35%),
        radial-gradient(circle at bottom left, rgba(255,116,20,0.08), transparent 35%),
        linear-gradient(135deg, #171717 0%, #101010 50%, #181818 100%);

    line-height: 1.7;
}


/* =========================================================
   MAIN CONTAINER
========================================================= */

.container {
    width: 100%;
    max-width: 1050px;
    margin: 0 auto;
    padding: 28px 22px 60px;
}


/* =========================================================
   HERO / PROFILE HEADER
========================================================= */

.profile-header {
    position: relative;
    overflow: hidden;

    background:
        linear-gradient(
            135deg,
            #252525 0%,
            #171717 60%,
            #20160f 100%
        );

    border: 1px solid rgba(255,116,20,0.55);

    border-radius: 28px;

    padding: 55px 45px;

    margin-bottom: 45px;

    box-shadow:
        0 20px 50px rgba(0,0,0,0.45),
        inset 0 1px 0 rgba(255,255,255,0.04);
}


/* Orange decorative circle */

.profile-header::after {
    content: "";
    position: absolute;

    width: 230px;
    height: 230px;

    right: -80px;
    top: -80px;

    border-radius: 50%;

    background: rgba(255,116,20,0.12);

    pointer-events: none;
}


.profile-header::before {
    content: "";

    position: absolute;

    width: 130px;
    height: 130px;

    right: 70px;
    bottom: -80px;

    border-radius: 50%;

    background: rgba(255,116,20,0.08);

    pointer-events: none;
}


.profile-label {
    position: relative;
    z-index: 2;

    color: #ff7414;

    font-size: 0.78rem;

    letter-spacing: 4px;

    font-weight: 700;

    margin-bottom: 15px;

    text-transform: uppercase;
}


.profile-title {
    position: relative;
    z-index: 2;

    color: #ffffff;

    font-size: clamp(2.3rem, 6vw, 4.8rem);

    line-height: 1.05;

    font-weight: 800;

    margin-bottom: 18px;
}


.profile-title span {
    color: #ff7414;
}


.profile-subtitle {
    position: relative;
    z-index: 2;

    max-width: 850px;

    color: #cfcfcf;

    font-size: 1rem;

    line-height: 1.8;
}


/* =========================================================
   CONTENT BOX
========================================================= */

.content-box {

    background:
        linear-gradient(
            145deg,
            #242424 0%,
            #191919 100%
        );

    border: 1px solid rgba(255,255,255,0.08);

    border-left: 4px solid #ff7414;

    border-radius: 20px;

    padding: 35px 38px;

    margin-bottom: 28px;

    box-shadow:
        0 15px 35px rgba(0,0,0,0.32);

    transition: 0.3s ease;
}


.content-box:hover {

    transform: translateY(-3px);

    border-color: rgba(255,116,20,0.45);

    box-shadow:
        0 20px 45px rgba(0,0,0,0.42);
}


/* =========================================================
   SECTION HEADING
========================================================= */

h2 {

    color: #ffffff;

    font-size: 1.8rem;

    line-height: 1.25;

    margin-bottom: 25px;

    padding-left: 16px;

    border-left: 4px solid #ff7414;
}


h2::first-letter {
    color: #ff7414;
}


/* =========================================================
   PARAGRAPH
========================================================= */

p {

    color: #cfcfcf;

    font-size: 1rem;

    line-height: 1.85;

    margin-bottom: 20px;
}


p:last-child {
    margin-bottom: 0;
}


/* =========================================================
   HIGHLIGHT
========================================================= */

.highlight {

    color: #ff7414;

    font-weight: 700;
}


/* =========================================================
   LIST
========================================================= */

ul {

    list-style: none;

    margin: 10px 0 25px;

    padding: 0;
}


li {

    position: relative;

    color: #d2d2d2;

    font-size: 1rem;

    line-height: 1.8;

    padding: 17px 20px 17px 48px;

    margin-bottom: 12px;

    background: rgba(255,255,255,0.035);

    border: 1px solid rgba(255,255,255,0.06);

    border-radius: 12px;
}


li::before {

    content: "✓";

    position: absolute;

    left: 18px;
    top: 15px;

    width: 23px;
    height: 23px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background: #ff7414;

    color: #111;

    font-size: 0.75rem;

    font-weight: 900;
}


/* =========================================================
   LINK
========================================================= */

.partner-link {

    display: inline-block;

    color: #ff7414;

    text-decoration: none;

    font-weight: 800;

    border: 1px solid #ff7414;

    border-radius: 8px;

    padding: 3px 10px;

    margin: 0 3px;

    transition: 0.3s ease;
}


.partner-link:hover {

    background: #ff7414;

    color: #111;
}


/* =========================================================
   QUOTE / BELIEF
========================================================= */

.quote-box {

    position: relative;

    padding: 30px 32px;

    background:
        linear-gradient(
            135deg,
            rgba(255,116,20,0.12),
            rgba(255,116,20,0.035)
        );

    border: 1px solid rgba(255,116,20,0.35);

    border-radius: 18px;

    margin-top: 10px;
}


.quote-box::before {

    content: "“";

    position: absolute;

    left: 18px;
    top: -12px;

    color: #ff7414;

    font-size: 5rem;

    line-height: 1;

    opacity: 0.35;
}


.quote-box p {

    color: #ffffff;

    font-size: 1.05rem;

    font-weight: 600;

    font-style: italic;

    margin: 0;

    position: relative;

    z-index: 2;
}


/* =========================================================
   BACK BUTTON
========================================================= */

.back-btn {

    display: block;

    width: 100%;

    text-align: center;

    margin-top: 35px;

    padding: 17px 20px;

    background:
        linear-gradient(
            135deg,
            #ff7414,
            #e85f00
        );

    border: none;

    border-radius: 12px;

    color: #ffffff;

    text-decoration: none;

    font-weight: 800;

    font-size: 0.95rem;

    letter-spacing: 0.5px;

    box-shadow:
        0 10px 25px rgba(255,116,20,0.25);

    transition: 0.3s ease;
}


.back-btn:hover {

    transform: translateY(-2px);

    box-shadow:
        0 15px 30px rgba(255,116,20,0.35);
}
