<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Communicationist - Mehedi Alim Ayon</title>

    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;

            font-family: Arial, Helvetica, sans-serif;

            color: #f5f5f5;

            background:
                radial-gradient(
                    circle at top right,
                    rgba(255,116,20,0.16),
                    transparent 35%
                ),
                radial-gradient(
                    circle at bottom left,
                    rgba(255,116,20,0.08),
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    #171717 0%,
                    #101010 50%,
                    #181818 100%
                );

            line-height: 1.7;
        }


        /* =====================================================
           MAIN CONTAINER
        ===================================================== */

        .container {
            width: 100%;
            max-width: 1050px;
            margin: 0 auto;
            padding: 28px 22px 60px;
        }


        /* =====================================================
           LOGO
        ===================================================== */

        .logo-container {
            text-align: center;

            background:
                linear-gradient(
                    135deg,
                    #252525 0%,
                    #171717 60%,
                    #20160f 100%
                );

            border: 1px solid rgba(255,116,20,0.55);

            border-radius: 22px;

            padding: 25px;

            margin-bottom: 28px;

            box-shadow:
                0 20px 45px rgba(0,0,0,0.40);
        }

        .logo {
            max-width: 450px;
            width: 100%;
            height: auto;

            display: block;
            margin: 0 auto;

            object-fit: contain;
        }


        /* =====================================================
           DESIGNATION
        ===================================================== */

        .designation-header {

            color: #ff7414;

            font-size: 1.55rem;

            font-weight: bold;

            text-align: center;

            margin-bottom: 35px;

            letter-spacing: 0.5px;

            line-height: 1.5;
        }


        /* =====================================================
           CONTENT BOX
        ===================================================== */

        .content-box {

            background:
                linear-gradient(
                    145deg,
                    #242424 0%,
                    #191919 100%
                );

            border: 1px solid rgba(255,255,255,0.08);

            border-left: 4px solid #ff7414;

            border-radius: 20px;

            padding: 35px 38px;

            margin-bottom: 28px;

            box-shadow:
                0 15px 35px rgba(0,0,0,0.32);

            transition: 0.3s ease;
        }

        .content-box:hover {

            transform: translateY(-3px);

            border-color: rgba(255,116,20,0.45);

            box-shadow:
                0 20px 45px rgba(0,0,0,0.42);
        }


        /* =====================================================
           HEADINGS
        ===================================================== */

        h2 {

            color: #ffffff;

            font-size: 1.8rem;

            line-height: 1.3;

            margin-bottom: 25px;

            padding-left: 16px;

            border-left: 4px solid #ff7414;
        }


        /* =====================================================
           PARAGRAPH
        ===================================================== */

        p {

            color: #cfcfcf;

            font-size: 1rem;

            line-height: 1.85;

            margin-bottom: 20px;
        }

        p:last-child {
            margin-bottom: 0;
        }


        /* =====================================================
           STRONG / HIGHLIGHT
        ===================================================== */

        strong {
            color: #ff7414;
            font-weight: 700;
        }


        /* =====================================================
           LIST
        ===================================================== */

        ul {

            list-style: none;

            margin: 15px 0 0;

            padding: 0;
        }

        li {

            position: relative;

            color: #d2d2d2;

            font-size: 1rem;

            line-height: 1.8;

            padding: 17px 20px 17px 50px;

            margin-bottom: 13px;

            background:
                rgba(255,255,255,0.035);

            border:
                1px solid rgba(255,255,255,0.06);

            border-radius: 12px;
        }

        li::before {

            content: "✓";

            position: absolute;

            left: 17px;
            top: 17px;

            width: 23px;
            height: 23px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: #ff7414;

            color: #111111;

            font-size: 0.75rem;

            font-weight: 900;
        }


        /* =====================================================
           BACK BUTTON
        ===================================================== */

        .back-btn {

            display: block;

            width: 100%;

            text-align: center;

            margin-top: 35px;

            padding: 17px 20px;

            background:
                linear-gradient(
                    135deg,
                    #242424,
                    #191919
                );

            border: 2px solid #ff7414;

            border-radius: 12px;

            color: #ff7414;

            text-decoration: none;

            font-weight: 800;

            font-size: 0.95rem;

            letter-spacing: 0.5px;

            transition: 0.3s ease;
        }

        .back-btn:hover {

            background: #ff7414;

            color: #ffffff;

            transform: translateY(-2px);

            box-shadow:
                0 10px 25px rgba(255,116,20,0.25);
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media screen and (max-width: 600px) {

            body {

                background:
                    radial-gradient(
                        circle at top right,
                        rgba(255,116,20,0.13),
                        transparent 40%
                    ),
                    linear-gradient(
                        145deg,
                        #181818 0%,
                        #111111 100%
                    );

                font-size: 16px;
            }


            .container {

                padding: 15px 12px 40px;
            }


            .logo-container {

                padding: 20px 15px;

                margin-bottom: 20px;

                border-radius: 18px;
            }


            .logo {

                width: 100%;

                max-width: 450px;

                height: auto;
            }


            .designation-header {

                font-size: 1.10rem;

                line-height: 1.4;

                margin-bottom: 25px;
            }


            .content-box {

                padding: 24px 20px;

                border-radius: 17px;

                margin-bottom: 20px;

                border-left-width: 3px;
            }


            h2 {

                font-size: 1.25rem;

                line-height: 1.35;

                padding-left: 11px;

                margin-bottom: 19px;
            }


            p {

                font-size: 0.88rem;

                line-height: 1.75;

                margin-bottom: 17px;
            }


            li {

                font-size: 0.86rem;

                line-height: 1.7;

                padding: 14px 15px 14px 42px;

                margin-bottom: 10px;
            }


            li::before {

                left: 14px;

                top: 14px;

                width: 21px;

                height: 21px;
            }


            .back-btn {

                font-size: 0.85rem;

                padding: 15px;
            }

        }


        /* =====================================================
           VERY SMALL PHONES
        ===================================================== */

        @media screen and (max-width: 380px) {

            .logo-container {

                padding: 15px 12px;
            }


            .designation-header {

                font-size: 1.05rem;
            }


            .content-box {

                padding: 21px 17px;
            }


            h2 {

                font-size: 1.12rem;
            }


            p {

                font-size: 0.84rem;

                line-height: 1.7;
            }


            li {

                font-size: 0.82rem;

                padding-left: 40px;
            }


            .back-btn {

                font-size: 0.82rem;
            }

        }

    </style>
</head>

<div class="container">

        >

    </div>


    <!-- =====================================================

    <div class="designation-header">
