/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    min-height: 100vh;

    font-family: Arial, Helvetica, sans-serif;

    color: #ffffff;

    background:
        radial-gradient(
            circle at top right,
            rgba(255,116,20,0.14),
            transparent 36%

        radial-gradient(
            circle at bottom left,
            rgba(255,116,20,0.07),
            transparent 36%

        linear-gradient(

            #171717 0%,
            #101010 52%,
            #181818 100%

    line-height: 1.8;
}

   MAIN CONTAINER
========================================================= */

.container {
    width: 100%;
    max-width: 900px;
    margin: 0 auto;
    padding: 25px 20px 50px;
}


/* =========================================================
   LOGO AREA
========================================================= */

.logo-container {

    width: 100%;

    text-align: center;

    margin-bottom: 25px;

    padding: 22px 25px;

    border-radius: 16px;

    /*
       Light warm background keeps the black logo/text
       clearly visible without changing the page theme.
    */
    background:
        linear-gradient(
            135deg,
            #f5eee6 0%,
            #fffaf5 50%,
            #f1e4d8 100%
        );

    border: 1px solid rgba(255,116,20,0.65);

    box-shadow:
        0 8px 28px rgba(0,0,0,0.35),
        0 0 20px rgba(255,116,20,0.10);

    overflow: hidden;
}


.logo {
    max-width: 450px;
    width: 100%;
    height: auto;

    margin: 0 auto;

    object-fit: contain;
}
