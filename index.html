<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mehedi Alim Ayon - Professional Profile</title>
    <style>
        body { 
            margin: 0; 
            background: #080c14; 
            font-family: 'Arial', sans-serif; 
            color: #ffffff; 
            line-height: 1.8; 
        }
        .container { max-width: 900px; margin: auto; padding: 0 0 40px 0; text-align: center; }
        
        /* বড় প্রফেশনাল ছবি সেকশন */
        .hero-img-container {
            width: 100%;
            max-height: 550px;
            overflow: hidden;
            background: #1a202c;
            border-bottom: 3px solid #ff7414;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }
        .hero-img {
            width: 100%;
            height: auto;
            object-fit: cover;
            display: block;
        }

        .profile-content {
            padding: 20px;
        }

        .name { color: #ffffff; font-size: 3.2rem; font-weight: bold; margin: 20px 0 10px 0; letter-spacing: 1px; }
        .designation { color: #ff7414; font-size: 1.6rem; font-weight: bold; margin-bottom: 35px; letter-spacing: 1px; }
        
        /* বাটন গ্রিড লেআউট */
        .menu-grid { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 15px; 
            padding: 0 20px;
        }
        
        .menu-btn { 
            padding: 20px 15px; 
            background: #1a202c; 
            border: 2px solid #ff7414; 
            color: #ffffff; 
            text-decoration: none; 
            font-weight: bold; 
            border-radius: 10px; 
            font-size: 1.6rem; 
            transition: 0.3s; 
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            text-transform: uppercase;
        }
        
        /* নিচের সারির ডান দিকের বাটন কমলা রঙের করার জন্য */
        .menu-btn.highlight-btn {
            background: #ff7414;
            color: #ffffff;
        }

        .menu-btn:hover { 
            background: #ff7414; 
            color: #ffffff; 
            transform: scale(1.02); 
        }

        /* মোবাইল স্ক্রিনের জন্য রেসপন্সিভ সেটআপ */
        @media (max-width: 768px) {
            .menu-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .name { font-size: 2.5rem; }
            .designation { font-size: 1.3rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- আপনার প্রফেশনাল ছবি -->
        <div class="hero-img-container">
            <img src="YOUR_PHOTO_LINK_HERE.jpg" alt="Mehedi Alim Ayon" class="hero-img">
        </div>

        <div class="profile-content">
            <div class="name">MEHEDI ALIM AYON</div>
            <div class="designation">AGRICULTURIST | COMMUNICATIONIST | KEY ACCOUNT MANAGER</div>

            <div class="menu-grid">
                <a href="agriculturist.html" class="menu-btn">Agriculturist</a>
                <a href="communicationist.html" class="menu-btn">Communicationist</a>
                <a href="kam.html" class="menu-btn">Key Account Manager</a>
                <a href="about.html" class="menu-btn" style="grid-column: span 1;">About Me</a>
                <a href="gallery.html" class="menu-btn" style="grid-column: span 1;">Gallery</a>
                <div style="display: none;"></div> <!-- স্পেস ম্যানেজমেন্টের জন্য -->
                <a href="resume.html" class="menu-btn">Profile / CV</a>
                <a href="contact.html" class="menu-btn highlight-btn">Contact</a>
            </div>
        </div>
    </div>
</body>
</html>
