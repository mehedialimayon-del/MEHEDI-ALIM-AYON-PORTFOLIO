<script>

/* =========================================================
   TYPEWRITER EFFECT
========================================================= */

const typedTextSpan =
    document.querySelector(".typed-text");

const textArray = [
    "AGRICULTURIST",
    "COMMUNICATIONIST",
    "KEY ACCOUNT MANAGER"
];

let textIndex = 0;
let charIndex = 0;


function type() {

    if (
        charIndex <
        textArray[textIndex].length
    ) {

        typedTextSpan.textContent +=
            textArray[textIndex].charAt(charIndex);

        charIndex++;

        setTimeout(type, 100);

    } else {

        setTimeout(erase, 2000);

    }
}


function erase() {

    if (charIndex > 0) {

        typedTextSpan.textContent =
            textArray[textIndex].substring(
                0,
                charIndex - 1
            );

        charIndex--;

        setTimeout(erase, 50);

    } else {

        textIndex =
            (textIndex + 1) %
            textArray.length;

        setTimeout(type, 500);
    }
}



/* =========================================================
   COUNTER ANIMATION
========================================================= */

const counters =
    document.querySelectorAll(".counter");


counters.forEach(counter => {

    counter.innerText = "0";

    const updateCounter = () => {

        const target =
            +counter.getAttribute("data-target");

        const current =
            +counter.innerText;

        const increment =
            target / 50;


        if (current < target) {

            counter.innerText =
                Math.ceil(
                    current + increment
                );

            setTimeout(
                updateCounter,
                30
            );

        } else {

            counter.innerText =
                target + "+";
        }
    };


    updateCounter();

});



/* =========================================================
   BUTTON CLICK EFFECT
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        setTimeout(type, 1000);


        const buttons =
            document.querySelectorAll(
                ".menu-button"
            );


        buttons.forEach(button => {

            button.addEventListener(
                "click",
                function() {

                    buttons.forEach(
                        b =>
                        b.classList.remove(
                            "visited-btn"
                        )
                    );

                    this.classList.add(
                        "visited-btn"
                    );

                }
            );

        });

    }
);

</script>


</body>
