<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Mehedi Alim Ayon - Professional Portfolio</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>

        /* =====================================================
           GLOBAL RESET
        ===================================================== */

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html {
            width: 100%;
            max-width: 100%;
            margin: 0;
            padding: 0;

            overflow-x: hidden;

            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        body {
            width: 100%;
            max-width: 100%;
            margin: 0;
            padding: 0;

            overflow-x: hidden;

            background:
                linear-gradient(
                    180deg,
                    #111827 0%,
                    #101622 55%,
                    #080c14 100%
                );

            font-family: Arial, Helvetica, sans-serif;

            color: #ffffff;
        }

        img {
            max-width: 100%;
        }

        a {
            -webkit-tap-highlight-color: transparent;
        }


        /* =====================================================
           PAGE
        ===================================================== */

        .page {
            width: 100%;
            max-width: 100%;
            min-height: 100vh;

            overflow-x: hidden;
        }


        /* =====================================================
           HOVER
        ===================================================== */

        .btn-hover {
            transition:
                transform 0.25s ease,
                filter 0.25s ease;
        }

        .btn-hover:hover {
            transform: scale(1.02);
            filter: brightness(1.2);
        }


        /* =====================================================
           HERO
           DESKTOP ORIGINAL
        ===================================================== */

        .hero {
            width: 100%;
            height: 60vh;
            min-height: 420px;

            position: relative;

            overflow: hidden;

            background: #111827;

            box-shadow:
                0 10px 30px rgba(0,0,0,0.6);
        }

        .hero-image {
            width: 100%;
            height: 100%;

            display: block;

            object-fit: cover;

            object-position: center 5%;
        }


        /* =====================================================
           SOCIAL ICONS
           DESKTOP ORIGINAL
        ===================================================== */

        .social-icons {
            position: absolute;

            top: 20px;
            right: 20px;

            display: flex;

            gap: 10px;

            z-index: 10;
        }

        .social-icons a {
            width: 45px;
            height: 45px;

            flex: 0 0 45px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 50%;

            color: #ffffff;

            text-decoration: none;

            font-size: 20px;

            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .linkedin {
            background: rgba(255,116,20,0.20);
            border: 1px solid #ff7414;
        }

        .email {
            background: rgba(255,116,20,0.20);
            border: 1px solid #ff7414;
        }

        .whatsapp {
            background: rgba(37,211,102,0.20);
            border: 1px solid #25d366;
        }
