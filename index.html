/* =========================================================
   GLOBAL
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    min-height: 100%;
    margin: 0;
    padding: 0;
    overflow-x: hidden;
    -webkit-text-size-adjust: 100%;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    color: #ffffff;
    background: #050a12;
}

a {
    -webkit-tap-highlight-color: transparent;
}

img {
    max-width: 100%;
}


/* =========================================================
   PAGE
========================================================= */

.page {
    width: 100%;
    min-height: 100vh;
    position: relative;
    overflow: hidden;
}


/* =========================================================
   HERO
========================================================= */

.hero {
    position: relative;
    width: 100%;
    height: 58vh;
    min-height: 350px;
    overflow: hidden;

    background:
        linear-gradient(
            180deg,
            #111827 0%,
            #080d17 100%
        );

    box-shadow:

}

.hero-image {
    width: 100%;
    height: 100%;

    display: block;

    object-fit: cover;
    object-position: center 8%;
}

.hero-gradient {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;

    width: 100%;
    height: 55%;

    background:
        linear-gradient(

            rgba(5,10,18,0),
            rgba(5,10,18,1)
        );

    pointer-events: none;
}

========================================================= */

.social-icons {

    right: 10px;

    display: flex;

}

.social-icons a {
    width: 30px;

    flex: 0 0 30px;

    align-items: center;
    justify-content: center;

    border-radius: 50%;

    text-decoration: none;

    font-size: 12px;

    background: rgba(5,10,18,.70);

    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);

    transition: .3s ease;
}

.linkedin,
.email {
    border: 1px solid #ff7414;
}

.linkedin:hover,
.email:hover {
    background: #ff7414;
}

.whatsapp {
    border: 1px solid #25d366;
    color: #25d366;
}

.whatsapp:hover {
    background: #25d366;

.main-content {

    z-index: 10;

    text-align: center;
}


/* =========================================================
   NAME
========================================================= */

.name {
    margin: 0 0 5px;

    color: #ffffff;

    font-size: 25px;
    line-height: 1.1;

    font-weight: 900;

    letter-spacing: .5px;

    white-space: nowrap;

    text-shadow:
        0 4px 15px rgba(0,0,0,.85);
}

.refresh-name {
    color: #ffffff;
    text-decoration: none;

    display: inline-block;

    cursor: pointer;

    transition: .2s ease;
}

.refresh-name:active {
    transform: scale(.97);
}


/* =========================================================
   TYPEWRITER
========================================================= */

.profession {
    margin: 0 0 15px;

    min-height: 18px;

    color: #ff7414;

    font-size: 12px;

    line-height: 1.3;

    font-weight: 800;

    letter-spacing: .8px;

    text-transform: uppercase;
}

.typed-text {
    color: #ff7414;
}

.cursor {
    display: inline-block;

    width: 2px;

    background: #ff7414;

    margin-left: 2px;

    animation: blink 1s infinite;
}

@keyframes blink {

    0%,
    100% {
        opacity: 1;
    }

    50% {
        opacity: 0;
    }
}


/* =========================================================
   BUTTON ROW
========================================================= */

.button-row {

    gap: 6px;

    margin-bottom: 7px;
}


/* =========================================================
   BUTTON
========================================================= */

    align-items: center;

    padding: 5px;

    color: #ffffff;

    text-decoration: none;

    text-align: center;

    font-weight: 800;

    line-height: 1.15;

    background:
        linear-gradient(
            145deg,
            rgba(37,43,59,.88),
            rgba(15,21,32,.95)
        );

    border: 1.5px solid rgba(255,116,20,.75);

    border-radius: 8px;

    overflow: hidden;

    transition:
        transform .25s ease,
        background .25s ease,
        box-shadow .25s ease;
}

.menu-button:active {
    transform: scale(.97);
}

    flex: 1 1 0;

}

========================================================= */

.middle-button {
    flex: 1 1 0;

    height: 45px;

    font-size: 11.5px;
}


/* =========================================================
   BOTTOM BUTTONS
========================================================= */

.bottom-button {
    flex: 1 1 0;

    height: 45px;

    font-size: 11.5px;

    background:

            135deg,
            #ff7414,
            #e85f08
        );

    border-color: #ff7414;
}


/* =========================================================
   CLICKED BUTTON
========================================================= */

.menu-button.visited-btn {
    background: #ff7414 !important;

    color: #ffffff !important;

    box-shadow:

}

}

.stat-card {
    flex: 1 1 0;

    padding: 8px 3px;

    border-radius: 8px;

    background:
        linear-gradient(

            rgba(255,255,255,.045),
            rgba(255,255,255,.012)
        );

    border: 1px solid rgba(255,116,20,.25);

    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
}

.stat-card h2 {
    margin: 0 0 2px;

    color: #ff7414;

    font-size: 1.15rem;

    line-height: 1;

    font-weight: 900;
}

.stat-card p {
    margin: 0;

    color: #d1d5db;

    font-size: .55rem;

    line-height: 1.1;

    letter-spacing: .4px;

    text-transform: uppercase;

    white-space: nowrap;
}
