<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mehedi Alim Ayon - Professional Portfolio</title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    >

    <style>
        /* =========================================================
           GLOBAL RESET
        ========================================================= */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            max-width: 100%;
            margin: 0;
            padding: 0;
            overflow-x: hidden !important;
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        body {
            background:
                linear-gradient(
                    180deg,
                    #111827 0%,
                    #101622 55%,
                    #080c14 100%
                );
            font-family: Arial, sans-serif;
            color: #ffffff;
        }

        img {
            max-width: 100%;
        }

        a {
            -webkit-tap-highlight-color: transparent;
        }

        /* =========================================================
           PAGE
        ========================================================= */

        .page {
            width: 100%;
            max-width: 100%;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* =========================================================
           HOVER & GLASS EFFECTS
        ========================================================= */

        .btn-hover {
            transition: all 0.3s ease-in-out !important;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .btn-hover:hover {
            transform: translateY(-3px) scale(1.02) !important;
            border-color: #ff7414 !important;
            box-shadow: 0 8px 20px rgba(255, 116, 20, 0.25);
            filter: brightness(1.15);
        }

        /* =========================================================
           HERO / HEADER IMAGE
        ========================================================= */

        .hero {
            width: 100%;
            height: 60vh;
            min-height: 420px;
            position: relative;
            overflow: hidden;
            background: #111827;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }

        .hero-image {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            object-position: center 5%;
        }

        /* =========================================================
           SOCIAL ICONS
        ========================================================= */

        .social-icons {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 20;
        }

        .social-icons a {
            width: 45px;
            height: 45px;
            flex: 0 0 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            color: #ffffff;
            text-decoration: none;
            font-size: 20px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .linkedin {
            background: rgba(255, 116, 20, 0.20);
            border: 1px solid #ff7414;
        }

        .email {
            background: rgba(255, 116, 20, 0.20);
            border: 1px solid #ff7414;
        }

        .whatsapp {
            background: rgba(37, 211, 102, 0.20);
            border: 1px solid #25d366;
        }

        /* =========================================================
           HERO GRADIENT
        ========================================================= */

        .hero-gradient {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: 50%;
            background: linear-gradient(to bottom, rgba(8, 12, 20, 0), rgba(8, 12, 20, 1));
            pointer-events: none;
            z-index: 2;
        }

        /* =========================================================
           MAIN CONTENT
        ========================================================= */

        .main-content {
            width: 100%;
            max-width: 850px;
            margin: -50px auto 0;
            padding: 20px 20px 40px;
            text-align: center;
            position: relative;
            z-index: 10;
        }

        /* =========================================================
           NAME & TYPEWRITER PROFESSION
        ========================================================= */

        .name {
            margin: 0 0 10px;
            color: #ffffff;
            font-size: 42px;
            line-height: 1.15;
            font-weight: 900;
            letter-spacing: 1.5px;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.8);
        }

        .profession {
            margin: 0 0 30px;
            color: #ff7414;
            font-size: 16px;
            line-height: 1.35;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            min-height: 24px;
        }

        .typed-text {
            color: #ff7414;
        }

        .cursor {
            display: inline-block;
            background-color: #ff7414;
            margin-left: 2px;
            width: 3px;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* =========================================================
           BUTTON ROW & MENU BUTTONS
        ========================================================= */

        .button-row {
            width: 100%;
            display: flex;
            gap: 12px;
            margin-bottom: 14px;
        }

        .menu-button {
            min-width: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            color: #ffffff;
            text-decoration: none;
            text-align: center;
            font-weight: 900;
            background: linear-gradient(145deg, rgba(37, 43, 59, 0.8), rgba(26, 32, 44, 0.8));
            border: 2px solid #ff7414;
            border-radius: 10px;
            overflow: hidden;
            overflow-wrap: anywhere;
            word-break: normal;
            flex-shrink: 1;
        }

        .top-button {
            flex: 1 1 0;
            min-height: 75px;
            font-size: 16px;
            line-height: 1.15;
        }

        .middle-button {
            flex: 1 1 0;
            height: 65px;
            font-size: 18px;
            line-height: 1.15;
        }

        .bottom-button {
            flex: 1 1 0;
            height: 65px;
            font-size: 18px;
            line-height: 1.15;
            background: #ff7414;
            border: 2px solid #ff7414;
        }

        /* =========================================================
           LIVE STATS / COUNTER SECTION
        ========================================================= */

        .stats-container {
            display: flex;
            justify-content: space-around;
            margin: 25px 0 10px;
            gap: 12px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.04);
            padding: 15px 10px;
            border-radius: 10px;
            border: 1px solid rgba(255, 116, 20, 0.3);
            text-align: center;
            flex: 1;
            backdrop-filter: blur(5px);
        }

        .stat-card h2 {
            color: #ff7414;
            font-size: 1.8rem;
            margin: 0 0 4px 0;
            font-weight: 900;
        }

        .stat-card p {
            margin: 0;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #d1d5db;
        }
/* =========================================================
   PERFECT MOBILE RESPONSIVE LAYOUT (MAX-WIDTH: 600PX)
========================================================= */

@media (max-width: 600px) {

    /* HERO IMAGE ADJUSTMENT FOR SMALL SCREEN FIT */
    .hero {
        height: 48vh !important;
        min-height: 280px !important;
    }

    /* SHIFT CONTENT UP & KEEP CENTERED */
    .main-content {
        width: 100% !important;
        max-width: 100% !important;
        margin: -55px auto 0 !important; /* Content shifted upward */
        padding: 10px 10px 20px !important;
        text-align: center !important;
    }

    /* NAME - SINGLE LINE FIT */
    .name {
        font-size: 21px !important;
        line-height: 1.1 !important;
        letter-spacing: 0.5px !important;
        white-space: nowrap !important;
        margin: 0 0 6px !important;
    }

    /* PROFESSION / TYPEWRITER FIT */
    .profession {
        font-size: 11px !important;
        margin: 0 0 15px !important;
        min-height: 18px !important;
    }

    /* BUTTON ROWS ALIGNMENT */
    .button-row {
        display: flex !important;
        justify-content: center !important;
        align-items: center !important;
        width: 100% !important;
        gap: 5px !important;
        margin-bottom: 7px !important;
    }

    /* MENU BUTTON BASE STYLE */
    .menu-button {
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        text-align: center !important;
        box-sizing: border-box !important;
        border-radius: 7px !important;
        font-weight: 800 !important;
        white-space: normal !important;
        word-break: keep-all !important;
        overflow-wrap: normal !important;
    }

    /* TOP 3 BUTTONS (AGRICULTURIST, COMMUNICATIONIST, KAM) */
    .top-button {
        flex: 1 1 0 !important;
        min-width: 0 !important;
        min-height: 52px !important;
        height: auto !important;
        font-size: 7.8px !important; /* Fits COMMUNICATIONIST without line break */
        line-height: 1.12 !important;
        padding: 4px 1px !important;
    }

    /* MIDDLE & BOTTOM BUTTONS */
    .middle-button, 
    .bottom-button {
        flex: 1 1 0 !important;
        min-width: 0 !important;
        height: 46px !important;
        font-size: 11.5px !important;
        line-height: 1.12 !important;
        padding: 4px !important;
    }

    /* STATS / COUNTER FIT */
    .stats-container {
        margin: 15px 0 5px !important;
        gap: 5px !important;
    }

    .stat-card {
        padding: 8px 4px !important;
    }

    .stat-card h2 {
        font-size: 1.1rem !important;
        margin-bottom: 2px !important;
    }

    .stat-card p {
        font-size: 0.55rem !important;
    }
}


/* =========================================================
   EXTRA SMALL MOBILE FIX (MAX-WIDTH: 380PX)
========================================================= */

@media (max-width: 380px) {

    .hero {
        height: 44vh !important;
    }

    .main-content {
        margin-top: -50px !important;
    }

    .name {
        font-size: 18px !important;
    }

    .profession {
        font-size: 9.5px !important;
    }

    .button-row {
        gap: 4px !important;
    }

    .top-button {
        min-height: 48px !important;
        font-size: 7px !important;
        padding: 3px 1px !important;
    }

    .middle-button, 
    .bottom-button {
        height: 42px !important;
        font-size: 10.5px !important;
    }
}


    </style>
</head>

<body>

<div class="page">

    <!-- HERO IMAGE -->
    <div class="hero">
        <img

            src="https://i.postimg.cc/nc4qDWyQ/IMG-20260811-WA0002.jpg"
        >

        <!-- SOCIAL ICONS -->
        <div class="social-icons">
            <a class="linkedin" href="https://www.linkedin.com/in/mehedi-alim-ayon-2a8435331" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">

            </a>
        </div>

        <div class="hero-gradient"></div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main-content">

        <!-- NAME -->
        <h1 class="name">MEHEDI ALIM AYON</h1>

        <!-- PROFESSION WITH TYPEWRITER EFFECT -->
        <p class="profession">
            <span class="typed-text"></span><span class="cursor">&nbsp;</span>
        </p>

        <!-- ROW 1 — THREE PROFESSIONAL AREAS -->
        <div class="button-row">
            <a href="agriculturist.html" class="menu-button top-button btn-hover">AGRICULTURIST</a>
            <a href="communicationist.html" class="menu-button top-button btn-hover">COMMUNICATIONIST</a>

        </div>

        <div class="button-row">

        <!-- LIVE STATS COUNTER SECTION -->
        <div class="stats-container">
            <div class="stat-card">
                <h2 class="counter" data-target="11">0</h2>

            </div>
            <div class="stat-card">
                <h2 class="counter" data-target="900">0</h2>

                <p>% Client Focus</p>
            </div>
        </div>

</div>

<!-- JAVASCRIPT FOR DYNAMIC EFFECTS -->
<script>
    // 1. TYPEWRITER EFFECT
    const typedTextSpan = document.querySelector(".typed-text");
    const textArray = ["AGRICULTURIST", "COMMUNICATIONIST", "KEY ACCOUNT MANAGER"];
    let textIndex = 0;
    let charIndex = 0;

    function type() {
        if (charIndex < textArray[textIndex].length) {
            typedTextSpan.textContent += textArray[textIndex].charAt(charIndex);
            charIndex++;
            setTimeout(type, 100);
        } else {
            setTimeout(erase, 2000);
        }
    }

    function erase() {
        if (charIndex > 0) {
            typedTextSpan.textContent = textArray[textIndex].substring(0, charIndex - 1);
            charIndex--;
            setTimeout(erase, 50);
        } else {
            textIndex = (textIndex + 1) % textArray.length;
            setTimeout(type, 500);
        }
    }

    // 2. COUNTER ANIMATION
    const counters = document.querySelectorAll('.counter');
    counters.forEach(counter => {
        counter.innerText = '0';
        const updateCounter = () => {
            const target = +counter.getAttribute('data-target');
            const c = +counter.innerText;
            const increment = target / 50;
            if (c < target) {
                counter.innerText = `${Math.ceil(c + increment)}`;
                setTimeout(updateCounter, 30);
            } else {
                counter.innerText = target + "+";
            }
        };
        updateCounter();
    });

    document.addEventListener("DOMContentLoaded", function() {
        if(textArray.length) setTimeout(type, 1000);
    });
</script>
