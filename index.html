<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mehedi Alim Ayon - Professional Portfolio</title>

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
>

<style>

/* =========================================================
   GLOBAL RESET
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    max-width: 100%;
    margin: 0;
    padding: 0;
    overflow-x: hidden !important;
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
}

body {
    background:
        linear-gradient(
            180deg,
            #111827 0%,
            #101622 55%,
            #080c14 100%
        );
    font-family: Arial, sans-serif;
    color: #ffffff;
}

img {
    max-width: 100%;
}

a {
    -webkit-tap-highlight-color: transparent;
}

/* =========================================================
   PAGE
========================================================= */

.page {
    width: 100%;
    max-width: 100%;
    min-height: 100vh;
    overflow-x: hidden;
}

/* =========================================================
   HOVER EFFECT
========================================================= */

.btn-hover {
    transition: all 0.3s ease-in-out !important;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
}

.btn-hover:hover {
    transform: translateY(-3px) scale(1.02) !important;
    border-color: #ff7414 !important;
    box-shadow: 0 8px 20px rgba(255,116,20,0.25);
    filter: brightness(1.15);
}

/* =========================================================
   BUTTON CLICK STATE
========================================================= */

.menu-button:active,
.menu-button.visited-btn {
    background: #ff7414 !important;
    color: #ffffff !important;
    border-color: #ff7414 !important;
    box-shadow:
        0 0 15px rgba(255,116,20,0.6) !important;
}

/* =========================================================
   HERO
========================================================= */

.hero {
    width: 100%;
    height: 60vh;
    min-height: 420px;
    position: relative;
    overflow: hidden;
    background: #111827;
    box-shadow:
        0 10px 30px rgba(0,0,0,0.6);
}

.hero-image {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    object-position: center 5%;
}

/* =========================================================
   SOCIAL ICONS
========================================================= */

.social-icons {
    position: absolute;
    top: 20px;
    right: 20px;
    display: flex;
    gap: 10px;
    z-index: 20;
}

.social-icons a {
    width: 45px;
    height: 45px;
    flex: 0 0 45px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    color: #ffffff;
    text-decoration: none;
    font-size: 20px;

    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
}

.linkedin,
.email {
    background: rgba(255,116,20,0.20);
    border: 1px solid #ff7414;
}

.whatsapp {
    background: rgba(37,211,102,0.20);
    border: 1px solid #25d366;
}

/* =========================================================
   HERO GRADIENT
========================================================= */

.hero-gradient {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;

    width: 100%;
    height: 50%;

    background:
        linear-gradient(
            to bottom,
            rgba(8,12,20,0),
            rgba(8,12,20,1)
        );

    pointer-events: none;
    z-index: 2;
}

/* =========================================================
   MAIN CONTENT
========================================================= */

.main-content {
    width: 100%;
    max-width: 850px;

    margin: -50px auto 0;
    padding: 20px 20px 40px;

    text-align: center;

    position: relative;
    z-index: 10;
}

/* =========================================================
   NAME
========================================================= */

.name {
    margin: 0 0 10px;

    color: #ffffff;

    font-size: 42px;
    line-height: 1.15;

    font-weight: 900;

    letter-spacing: 1.5px;

    text-shadow:
        0 4px 15px rgba(0,0,0,0.8);
}

.refresh-name {
    color: inherit;
    text-decoration: none;
    cursor: pointer;

    display: inline-block;

    transition:
        transform 0.2s ease,
        opacity 0.2s ease;
}

.refresh-name:active {
    transform: scale(0.97);
    opacity: 0.8;
}

/* =========================================================
   PROFESSION / TYPEWRITER
========================================================= */

.profession {
    margin: 0 0 30px;

    color: #ff7414;

    font-size: 16px;
    line-height: 1.35;

    font-weight: 800;

    letter-spacing: 1px;

    text-transform: uppercase;

    min-height: 24px;
}

.typed-text {
    color: #ff7414;
}

.cursor {
    display: inline-block;

    background-color: #ff7414;

    margin-left: 2px;

    width: 3px;

    animation: blink 1s infinite;
}

@keyframes blink {

    0%,
    100% {
        opacity: 1;
    }

    50% {
        opacity: 0;
    }

}

/* =========================================================
   BUTTON ROW
========================================================= */

.button-row {
    width: 100%;

    display: flex;

    gap: 12px;

    margin-bottom: 14px;
}

/* =========================================================
   MENU BUTTON
========================================================= */

.menu-button {
    min-width: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    padding: 10px;

    color: #ffffff;

    text-decoration: none;

    text-align: center;

    font-weight: 900;

    background:
        linear-gradient(
            145deg,
            rgba(37,43,59,0.8),
            rgba(26,32,44,0.8)
        );

    border:
        2px solid #ff7414;

    border-radius: 10px;

    overflow: hidden;

    overflow-wrap: anywhere;

    word-break: normal;

    flex-shrink: 1;
}

/* =========================================================
   TOP BUTTONS
========================================================= */

.top-button {
    flex: 1 1 0;

    min-height: 75px;

    font-size: 16px;

    line-height: 1.15;
}

/* =========================================================
   MIDDLE BUTTONS
========================================================= */

.middle-button {
    flex: 1 1 0;

    height: 65px;

    font-size: 18px;

    line-height: 1.15;
}

/* =========================================================
   BOTTOM BUTTONS
========================================================= */

.bottom-button {
    flex: 1 1 0;

    height: 65px;

    font-size: 18px;

    line-height: 1.15;

    background: #ff7414;

    border: 2px solid #ff7414;
}

/* =========================================================
   STATS
========================================================= */

.stats-container {
    display: flex;

    justify-content: space-around;

    margin: 25px 0 10px;

    gap: 12px;
}

.stat-card {
    background:
        rgba(255,255,255,0.04);

    padding: 15px 10px;

    border-radius: 10px;

    border:
        1px solid rgba(255,116,20,0.3);

    text-align: center;

    flex: 1;

    backdrop-filter: blur(5px);
}

.stat-card h2 {
    color: #ff7414;

    font-size: 1.8rem;

    margin: 0 0 4px;

    font-weight: 900;
}

.stat-card p {
    margin: 0;

    font-size: 0.75rem;

    text-transform: uppercase;

    letter-spacing: 0.5px;

    color: #d1d5db;
}


/* =========================================================
   MOBILE VERSION
   600PX AND BELOW
========================================================= */

@media (max-width: 600px) {

    .hero {
        height: 58vh !important;
        min-height: 350px !important;
    }

    .social-icons {
        top: 8px !important;
