        <div class="stat-card">    
            <h2 class="counter" data-target="11">0</h2>    
            <p>Countries Sourced</p>    
        </div>    
        <div class="stat-card">    
            <h2 class="counter" data-target="900">0</h2>    
            <p>Products Managed</p>    
        </div>    
        <div class="stat-card">    
            <h2 class="counter" data-target="100">0</h2>

</div>

</div>    <!-- JAVASCRIPT FOR DYNAMIC EFFECTS -->    <script>    
    // 1. TYPEWRITER EFFECT    
    const typedTextSpan = document.querySelector(".typed-text");    
    const textArray = ["AGRICULTURIST", "COMMUNICATIONIST", "KEY ACCOUNT MANAGER"];    
    let textIndex = 0;    
    let charIndex = 0;    
    
    function type() {    
        if (charIndex < textArray[textIndex].length) {    
            typedTextSpan.textContent += textArray[textIndex].charAt(charIndex);    
            charIndex++;    
            setTimeout(type, 100);    
        } else {    
            setTimeout(erase, 2000);    
        }    
    }    
    
    function erase() {    
        if (charIndex > 0) {    
            typedTextSpan.textContent = textArray[textIndex].substring(0, charIndex - 1);    
            charIndex--;    
            setTimeout(erase, 50);    
        } else {    
            textIndex = (textIndex + 1) % textArray.length;    
            setTimeout(type, 500);    
        }    
    }    
    
    // 2. COUNTER ANIMATION    
    const counters = document.querySelectorAll('.counter');    
    counters.forEach(counter => {    
        counter.innerText = '0';    
        const updateCounter = () => {    
            const target = +counter.getAttribute('data-target');    
            const c = +counter.innerText;    
            const increment = target / 50;    
            if (c < target) {    
                counter.innerText = `${Math.ceil(c + increment)}`;    
                setTimeout(updateCounter, 30);    
            } else {    
                counter.innerText = target + "+";    
            }    
        };    
        updateCounter();    
    });    
    
        // 3. REFRESH-SAFE BUTTON CLICK EFFECT (NO PERSISTENT ORANGE)    
    document.addEventListener("DOMContentLoaded", function () {    
        if(textArray.length) setTimeout(type, 1000);    
    
        // CLEAR ANY OLD SESSION DATA ON RELOAD    
        sessionStorage.clear();    
    
        const buttons = document.querySelectorAll(".menu-button");    
        buttons.forEach(button => {    
            // TOUCH / CLICK RESPONSE    
            button.addEventListener("click", function () {    
                buttons.forEach(b => b.classList.remove("visited-btn"));    
                this.classList.add("visited-btn");    
            });    
        });    
    });    
    
</script>    </body>    
</html>
