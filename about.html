<html lang="en">

    <title>About Me - Mehedi Alim Ayon</title>

    <style>

        /* =========================================================
           DESKTOP — ORIGINAL DESIGN
        ========================================================= */

        body {
            margin: 0;
            background: #080c14;
            font-family: Arial, sans-serif;
            color: #ffffff;
            line-height: 1.8;
            font-size: 2rem;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 20px;
        }

        .profile-header {
            text-align: center;
            margin-bottom: 30px;
            background: #1a202c;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #ff7414;
        }

        .profile-title {
            color: #ff7414;
            font-size: 2.8rem;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .profile-subtitle {
            color: #d1d5db;
            font-size: 2rem;
        }

        h2 {
            color: #ff7414;
            border-left: 5px solid #ff7414;
            padding-left: 15px;
            margin-top: 30px;
            font-size: 2.3rem;
        }

        .content-box {
            background: #1a202c;
            padding: 30px;
            border-radius: 10px;
            border: 1px solid #ff7414;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }

        .highlight {
            color: #ff7414;
            font-weight: bold;
        }

        p {
            color: #d1d5db;
            font-size: 2rem;
            margin-bottom: 20px;
        }

        ul {
            color: #d1d5db;
            padding-left: 25px;
        }

        li {
            font-size: 2rem;
            margin-bottom: 15px;
        }

        .quote-box {
            background: #1a202c;
            border: 1px solid #ff7414;
            border-left: 5px solid #ff7414;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 10px;
            text-align: center;
        }

        .quote-box p {
            color: #ffffff;
            font-style: italic;
            margin: 0;
        }

        .back-btn {
            display: block;
            text-align: center;
            margin-top: 30px;
            padding: 18px;
            background: #1a202c;
            border: 2px solid #ff7414;
            border-radius: 10px;
            color: #ff7414;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.8rem;
            transition: 0.3s;
        }

        .back-btn:hover {
            background: #ff7414;
            color: #ffffff;
            transform: scale(1.02);
        }
