/* =========================================================
   MEHEDI ALIM AYON — ABOUT ME
   PREMIUM BLACK + ORANGE THEME
   ========================================================= */

:root{
    --bg:#171411;
    --bg-soft:#211b17;
    --card:#fff4e7;
    --card-soft:#f8eadb;
    --orange:#ff7414;
    --orange-dark:#d95d08;
    --orange-light:#ff9a4a;
    --text:#f5e9dc;
    --dark-text:#29221d;
    --muted:#746a62;
    --border:rgba(255,116,20,.28);
    --shadow:0 15px 40px rgba(0,0,0,.22);
}

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    padding:0;
    background:
        radial-gradient(circle at 15% 5%, rgba(255,116,20,.10), transparent 30%),
        radial-gradient(circle at 85% 35%, rgba(255,154,74,.07), transparent 28%),
        var(--bg);
    color:var(--text);
    font-family:Arial, Helvetica, sans-serif;
    line-height:1.7;
}

/* =========================================================
   MAIN CONTAINER
   ========================================================= */

.container{
    width:min(1120px, 94%);
    margin:0 auto;
    padding:45px 0 70px;
}

/* =========================================================
   HERO
   ========================================================= */

.hero{
    position:relative;
    overflow:hidden;
    background:
        linear-gradient(135deg,#261d17,#342118);
    border:1px solid var(--border);
    border-radius:28px;
    padding:65px 55px;
    margin-bottom:45px;
    box-shadow:var(--shadow);
}

.hero::before{
    content:"";
    position:absolute;
    width:260px;
    height:260px;
    border-radius:50%;
    background:rgba(255,116,20,.10);
    right:-90px;
    top:-100px;
}

.hero::after{
    content:"";
    position:absolute;
    width:170px;
    height:170px;
    border-radius:50%;
    background:rgba(255,154,74,.07);
    left:-80px;
    bottom:-80px;
}

.eyebrow{
    position:relative;
    z-index:2;
    color:var(--orange-light);
    font-size:.78rem;
    font-weight:800;
    letter-spacing:4px;
    text-transform:uppercase;
    margin-bottom:18px;
}

.hero h1{
    position:relative;
    z-index:2;
    margin:0;
    color:#f9e9da;
    font-size:clamp(2.6rem,7vw,5.5rem);
    line-height:1;
    letter-spacing:-3px;
}

.hero h1 span{
    color:var(--orange);
}

.hero-line{
    width:70px;
    height:4px;
    background:var(--orange);
    border-radius:10px;
    margin:25px 0;
}

.hero p{
    position:relative;
    z-index:2;
    max-width:850px;
    color:#d8c9bb;
    font-size:1.05rem;
    margin:0;
}
