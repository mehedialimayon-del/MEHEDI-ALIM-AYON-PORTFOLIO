/* =========================================================
   GLOBAL
========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#07090d;
    color:#ffffff;
    font-family:Arial, Helvetica, sans-serif;
    line-height:1.7;
    overflow-x:hidden;
}

.container{

/* =========================================================
   HERO
========================================================= */

.profile-header{
    position:relative;
    background:linear-gradient(135deg,#ffffff 0%,#f7f7f7 100%);
    color:#111111;
    padding:65px 55px;
    border-radius:0 0 45px 45px;
    margin-bottom:55px;
    overflow:hidden;
    box-shadow:0 15px 40px rgba(0,0,0,0.45);
}

.profile-header::before{
    content:"";
    position:absolute;
    width:260px;
    height:260px;
    right:-100px;
    top:-120px;
    background:rgba(255,116,20,0.12);
    border-radius:50%;
}

.profile-header::after{
    content:"";
    position:absolute;
    width:160px;
    height:160px;
    left:-70px;
    bottom:-80px;
    background:rgba(255,116,20,0.08);
    border-radius:50%;
}

.profile-tag{
    color:#ff7414;
    font-size:0.75rem;
    font-weight:bold;
    letter-spacing:4px;
    text-transform:uppercase;
    margin-bottom:15px;
    position:relative;
    z-index:2;
}

.profile-title{
    font-size:4rem;
    line-height:1.05;
    font-weight:900;
    color:#111827;
    position:relative;
    z-index:2;
}

.profile-title span{
    color:#ff7414;
}

.profile-subtitle{
    margin-top:22px;
    color:#626872;
    font-size:1.05rem;
    max-width:850px;
    position:relative;
    z-index:2;
}

.orange-line{
    width:55px;
    height:4px;
    background:#ff7414;
    margin-top:25px;
    border-radius:10px;
}


/* =========================================================
   SECTION
========================================================= */

.section{
    margin-bottom:65px;
}

.section-label{
    color:#ff7414;
    font-size:0.72rem;
    font-weight:bold;
    letter-spacing:4px;
    text-transform:uppercase;
    margin-bottom:8px;
}

.section-title{
    font-size:2.7rem;
    line-height:1.15;
    font-weight:900;
    margin-bottom:20px;
}

.section-title span{
    color:#ff7414;

.section-intro{
    color:#c5c8ce;
    font-size:1rem;
    margin-bottom:28px;
    max-width:1000px;
}


/* =========================================================
   CARD GRID
========================================================= */

.card-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:22px;
}

.content-box{
    background:#15191f;
    border:1px solid rgba(255,116,20,0.22);
    border-radius:20px;
    padding:32px;
    box-shadow:0 12px 30px rgba(0,0,0,0.28);
    transition:0.3s ease;
}

.content-box:hover{
    transform:translateY(-4px);
    border-color:rgba(255,116,20,0.65);
    box-shadow:0 18px 38px rgba(0,0,0,0.38);
}

.content-box.full{
    grid-column:1 / -1;
}

.card-icon{
    width:50px;
    height:50px;
    border-radius:50%;
    background:#ff7414;
    color:#ffffff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.25rem;
    font-weight:bold;
    margin-bottom:20px;
    box-shadow:0 8px 20px rgba(255,116,20,0.25);
}

.card-title{
    color:#ffffff;
    font-size:1.35rem;
    font-weight:800;
    margin-bottom:15px;
}

.content-box p{
    color:#c7cbd1;
    font-size:0.98rem;
    margin-bottom:17px;
}

.content-box p:last-child{
    margin-bottom:0;
}

.highlight{
    color:#ff7414;
    font-weight:800;
}


/* =========================================================
   EDUCATION / TIMELINE
========================================================= */

.timeline{
    position:relative;
    margin-top:30px;
}

.timeline::before{
    content:"";
    position:absolute;
    left:100px;
    top:0;
    bottom:0;
    width:2px;
    background:rgba(255,116,20,0.25);
}

.timeline-item{
    position:relative;
    display:grid;
    grid-template-columns:150px 1fr;
    gap:25px;
    margin-bottom:24px;
}

.timeline-year{
    background:#1b2027;
    border:1px solid rgba(255,116,20,0.35);
    border-radius:12px;
    padding:13px 10px;
    height:max-content;
    text-align:center;
    color:#ff7414;
    font-weight:900;
    font-size:0.85rem;
    position:relative;
    z-index:2;
}

.timeline-card{
    background:#15191f;
    border:1px solid rgba(255,116,20,0.18);
    border-radius:18px;
    padding:25px 28px;
    box-shadow:0 10px 25px rgba(0,0,0,0.25);
}

.timeline-card h3{
    color:#ffffff;
    font-size:1.1rem;
    margin-bottom:9px;
}

.timeline-card p{
    margin:0;
    font-size:0.92rem;
}

   LIST

.custom-list{

    content:"";
    position:absolute;
    left:0;
    top:10px;
    width:8px;
    height:8px;

    background:#ff7414;
}


/* =========================================================
   QUOTE
========================================================= */

.quote-box{
    background:linear-gradient(135deg,#15191f,#101318);

}
