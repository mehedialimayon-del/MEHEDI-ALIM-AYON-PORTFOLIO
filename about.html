html{

}

body{

    font-size:16px;
}

/* Main container */

.container{
    max-width:1050px;
    margin:auto;
    padding:35px 22px 60px;
}

/* =========================================================
   HEADER
========================================================= */

.profile-header{
    position:relative;
    overflow:hidden;

    margin-bottom:38px;
    padding:55px 48px;

}

.profile-header::after{
    content:"";

    background:rgba(255,116,20,.18);
}

.profile-title{

}

    color:#c84d00;
}

.profile-subtitle{
    position:relative;
    z-index:2;
    color:#633017;

    font-weight:500;

}

========================================================= */

.section-label{

}

========================================================= */

}

.content-box::before{
    content:"";
    position:absolute;
    width:150px;
    height:150px;
    border-radius:50%;
    right:-65px;
    top:-65px;
    background:rgba(255,116,20,.08);
}

.content-box h2{
    position:relative;
    z-index:2;

    color:#ff9a4a;
    font-size:1.65rem;

    margin:0 0 22px;

    padding-left:15px;
}

.content-box p{
    position:relative;
    z-index:2;

    color:#f2d8c4;
    font-size:1rem;
    line-height:1.85;
    margin:0 0 18px;
}

.content-box p:last-child{
    margin-bottom:0;
}

/* =========================================================
   HIGHLIGHT
========================================================= */

.highlight{
    color:#ff9a4a;
    font-weight:800;
}

/* =========================================================
   LIST
========================================================= */

.content-box ul{
    position:relative;
    z-index:2;

    margin:0 0 18px;
    padding-left:22px;
}

.content-box li{
    color:#f2d8c4;
    font-size:1rem;
    line-height:1.8;
    margin-bottom:12px;
    padding-left:5px;
}

.content-box li::marker{
    color:#ff7414;
}
