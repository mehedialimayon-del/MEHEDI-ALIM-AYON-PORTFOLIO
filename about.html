           DESKTOP DESIGN — ORIGINAL FORMAT
        ========================================================= */

        body {
            margin: 0;
            background: #080c14;

            color: #ffffff;
            line-height: 1.8;
            font-size: 2rem;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 20px;
        }

        /* =========================================================
           PROFILE HEADER
        ========================================================= */

        .profile-header {
            text-align: center;
            margin-bottom: 30px;
            background: #1a202c;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #ff7414;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }

        .profile-title {
            color: #ff7414;
            font-size: 2.8rem;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .profile-subtitle {

        }

        /* =========================================================
           HEADINGS
        ========================================================= */

        h2 {

            font-size: 2.3rem;
        }

           CONTENT BOX
        ========================================================= */

        .content-box {

            padding: 30px;
            border-radius: 10px;

            margin-bottom: 25px;

        }

           HIGHLIGHT

        ========================================================= */

            font-weight: bold;
            font-size: 1.8rem;
            transition: 0.3s;
        }

        .back-btn:hover {
            background: #ff7414;
            color: #ffffff;
            transform: scale(1.02);
        }

           TEXT
