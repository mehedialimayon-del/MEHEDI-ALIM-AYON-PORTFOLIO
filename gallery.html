<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio Gallery</title>
  <style>
    body {
      background-color: #0b132b;
      color: #ffffff;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 15px;
    }

    h1 {
      text-align: center;
      color: #ff6600;
      margin-top: 5px;
      margin-bottom: 20px;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-size: 24px;
    }

    .filter-container {
      display: flex;
      flex-wrap: nowrap;
      overflow-x: auto;
      gap: 8px;
      margin-bottom: 25px;
      padding-bottom: 8px;
      scrollbar-width: thin;
      scrollbar-color: #ff6600 #1c2541;
    }

    .filter-container::-webkit-scrollbar {
      height: 4px;
    }
    .filter-container::-webkit-scrollbar-thumb {
      background: #ff6600;
      border-radius: 4px;
    }

    .filter-btn {
      background-color: #1c2541;
      border: 2px solid #ff6600;
      color: #ffffff;
      padding: 8px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      font-size: 13px;
      white-space: nowrap;
      transition: all 0.3s ease;
      outline: none;
      flex-shrink: 0;
    }

    .filter-btn:hover, .filter-btn.active {
      background-color: #ff6600;
      color: #ffffff;
      box-shadow: 0 0 10px rgba(255, 102, 0, 0.5);
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 15px;
      padding: 5px;
    }

    .gallery-card {
      background-color: #1c2541;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      transition: transform 0.3s ease;
    }

    .gallery-card:hover {
      transform: translateY(-5px);
    }

    .gallery-card img {
      width: 100%;
      height: 280px;
      object-fit: cover;
      display: block;
    }

    .status-msg {
      text-align: center;
      width: 100%;
      font-size: 16px;
      color: #a0aec0;
      grid-column: 1 / -1;
      padding: 40px 0;
    }
  </style>
</head>
<body>

  <h1>PORTFOLIO GALLERY</h1>

  <!-- ক্যাটাগরি ফিল্টার বাটন সমূহ -->
  <div class="filter-container">
    <button class="filter-btn active" onclick="loadPhotos('pran', this)">PRAN GROUP</button>
    <button class="filter-btn" onclick="loadPhotos('eco', this)">ECO EXPO</button>
    <button class="filter-btn" onclick="loadPhotos('academic', this)">ACADEMIC</button>
    <button class="filter-btn" onclick="loadPhotos('family', this)">FAMILY</button>
    <button class="filter-btn" onclick="loadPhotos('myself', this)">MYSELF</button>
  </div>

  <!-- ছবি দেখানোর কন্টেইনার -->
  <div id="gallery" class="gallery-grid">
    <div class="status-msg">ছবি লোড হচ্ছে...</div>
  </div>

  <script>
    // বিভিন্ন ফোল্ডারের ছবির ফাইল আইডিগুলো এখানে বসাবেন
    const galleryData = {
      pran: [
        "এখানে_প্রাণের_ছবির_ফাইল_আইডি_দিন",
        "আরেকটি_ছবির_আইডি"
      ],
      eco: [
        "এখানে_ইকো_এক্সপোর_ছবির_আইডি_দিন"
      ],
      academic: [
        "এখানে_একাডেমিকের_ছবির_আইডি_দিন"
      ],
      family: [
        "এখানে_ফ্যামিলির_ছবির_আইডি_দিন"
      ],
      myself: [
        "এখানে_নিজের_ছবির_আইডি_দিন"
      ]
    };

    function loadPhotos(category, btnElement) {
      if (btnElement) {
        document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
        btnElement.classList.add('active');
      }

      const gallery = document.getElementById('gallery');
      gallery.innerHTML = '';

      const photoIds = galleryData[category] || [];

      if (photoIds.length > 0 && photoIds[0] !== "এখানে_প্রাণের_ছবির_ফাইল_আইডি_দিন") {
        photoIds.forEach(id => {
          const card = document.createElement('div');
          card.className = 'gallery-card';

          const img = document.createElement('img');
          // গুগল ড্রাইভের ডিরেক্ট ইমেজ লিংক ফরম্যাট
          img.src = `https://lh3.googleusercontent.com/d/${id}`;
          img.loading = 'lazy';

          card.appendChild(img);
          gallery.appendChild(card);
        });
      } else {
        gallery.innerHTML = '<div class="status-msg">এই ক্যাটাগরিতে এখনো কোনো ছবি যোগ করা হয়নি।</div>';
      }
    }

    // প্রথমে PRAN GROUP এর ছবি দেখাবে
    window.onload = () => {
      loadPhotos('pran');
    };
  </script>

</body>
</html>
