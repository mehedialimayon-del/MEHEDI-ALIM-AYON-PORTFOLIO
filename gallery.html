<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>83</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * { 
            box-sizing: border-box; 
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        body {
            background: linear-gradient(180deg, #111827 0%, #101622 55%, #080c14 100%);
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 25px 15px;
            min-height: 100vh;
        }

        .gallery-title {
            text-align: center;
            color: #ff7414;
            font-size: 32px;
            font-weight: 900;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 4px 20px rgba(255, 116, 20, 0.4);
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 18px;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .photo-card {
            background: rgba(37, 43, 59, 0.55);
            border: 1.5px solid rgba(255, 116, 20, 0.4);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .photo-card::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 2;
        }

        .photo-card:hover {
            transform: translateY(-5px);
            border-color: #ff7414;
            box-shadow: 0 10px 30px rgba(255, 116, 20, 0.3);
        }

        .photo-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            display: block;
            pointer-events: none;
        }

        .photo-caption {
            padding: 12px;
            font-size: 13px;
            color: #f3f4f6;
            text-align: center;
            background: rgba(17, 24, 39, 0.9);
            font-weight: 700;
            border-top: 1px solid rgba(255, 116, 20, 0.2);
        }

        .lightbox {
            display: none;
            position: fixed;
            z-index: 9999;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(8, 12, 20, 0.95);
            backdrop-filter: blur(15px);
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 15px;
        }

        .lightbox-img {
            max-width: 90%;
            max-height: 80vh;
            border-radius: 10px;
            border: 2px solid #ff7414;
            box-shadow: 0 0 30px rgba(255, 116, 20, 0.4);
            object-fit: contain;
            pointer-events: none;
        }

        .lightbox-caption {
            margin-top: 15px;
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            text-align: center;
        }

        .lightbox-close {
            position: absolute;
            top: 20px; right: 25px;
            color: #ff7414;
            font-size: 35px;
            cursor: pointer;
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <h1 class="gallery-title">83</h1>

    <div class="gallery-grid" id="gallery-container">
        <p style="text-align:center; width:100%; color: #ff7414; grid-column: 1/-1;">Loading Gallery...</p>
    </div>

    <div id="lightbox" class="lightbox" onclick="closeLightbox()">
        <span class="lightbox-close">&times;</span>
        <img id="lightbox-img" class="lightbox-img" src="" alt="Full View">
        <div id="lightbox-caption" class="lightbox-caption"></div>
    </div>

    <script>
        // আপনার দেওয়া এপিআই কি এবং ফোল্ডার আইডি সেটিং
        const API_KEY = 'AIzaSyA_placeholder_your_key_here'; 
        const TARGET_FOLDER_ID = '1jfLl4PG4xT1jIv25fMvWY3HH32PYNudr'; 

        document.addEventListener('keydown', function(e) {
            if (e.key === 'PrintScreen') navigator.clipboard.writeText('');
            if (e.ctrlKey && (e.key === 'p' || e.key === 's' || e.key === 'u' || e.key === 'i')) e.preventDefault();
        });

        async function loadDrivePhotos() {
            const container = document.getElementById('gallery-container');
            const url = `https://www.googleapis.com/drive/v3/files?q='${TARGET_FOLDER_ID}'+in+parents+and+trashed=false&key=${API_KEY}&fields=files(id,name,description,mimeType)&pageSize=100`;

            try {
                const res = await fetch(url);
                const data = await res.json();
                container.innerHTML = '';

                if (data.files && data.files.length > 0) {
                    const imageFiles = data.files.filter(f => f.mimeType && f.mimeType.startsWith('image/'));

                    if(imageFiles.length > 0) {
                        imageFiles.forEach(file => {
                            const imgUrl = `https://lh3.googleusercontent.com/d/${file.id}`;
                            const caption = file.description ? file.description : '';

                            const card = document.createElement('div');
                            card.className = 'photo-card';
                            card.onclick = () => openLightbox(imgUrl, caption);
                            card.innerHTML = `
                                <img src="${imgUrl}" alt="${file.name}" loading="lazy" ondragstart="return false;">
                                ${caption ? `<div class="photo-caption">${caption}</div>` : ''}
                            `;
                            container.appendChild(card);
                        });
                    } else {
                        container.innerHTML = '<p style="text-align:center; width:100%; color: #9ca3af; grid-column: 1/-1;">No photos found inside the folder!</p>';
                    }
                } else {
                    container.innerHTML = '<p style="text-align:center; width:100%; color: #9ca3af; grid-column: 1/-1;">No files found!</p>';
                }
            } catch (err) {
                console.error(err);
                container.innerHTML = '<p style="text-align:center; width:100%; color: #ef4444; grid-column: 1/-1;">Error loading photos. Please check API Key/Permissions.</p>';
            }
        }

        function openLightbox(src, caption) {
            document.getElementById('lightbox-img').src = src;
            document.getElementById('lightbox-caption').innerText = caption;
            document.getElementById('lightbox').style.display = 'flex';
        }

        function closeLightbox() {
            document.getElementById('lightbox').style.display = 'none';
        }

        loadDrivePhotos();
    </script>
</body>
</html>
