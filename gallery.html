
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Portfolio Gallery - Mehedi Alim Ayon</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>

/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    padding: 0;
    min-height: 100vh;

    font-family: Arial, Helvetica, sans-serif;

    color: #f5f5f5;

    background:
        radial-gradient(circle at top right, rgba(255,116,20,0.16), transparent 35%),
        radial-gradient(circle at bottom left, rgba(255,116,20,0.08), transparent 35%),
        linear-gradient(135deg, #171717 0%, #101010 50%, #181818 100%);

    line-height: 1.7;
}


/* =========================================================
   MAIN CONTAINER
========================================================= */

.container {
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
    padding: 28px 22px 60px;
}


/* =========================================================
   GALLERY TITLE
========================================================= */

.gallery-title {
    text-align: center;
    color: #ffffff;
    font-size: clamp(1.8rem, 4vw, 2.4rem);
    font-weight: 800;
    margin-bottom: 35px;
    letter-spacing: 1px;
    text-transform: uppercase;
}

.gallery-title span {
    color: #ff7414;
}


/* =========================================================
   GALLERY GRID (MASONRY)
========================================================= */

.gallery-grid {
    column-count: 1;
    column-gap: 18px;
    width: 100%;
    margin-bottom: 35px;
}

@media (min-width: 600px) {
    .gallery-grid {
        column-count: 2;
    }
}

@media (min-width: 1024px) {
    .gallery-grid {
        column-count: 3;
    }
}


/* =========================================================
   PHOTO CARD
========================================================= */

.photo-card {
    background:
        linear-gradient(
            145deg,
            #242424 0%,
            #191919 100%
        );

    border: 1px solid rgba(255,255,255,0.08);
    border-top: 3px solid #ff7414;
    border-radius: 16px;
    overflow: hidden;
    display: inline-block;
    width: 100%;
    margin-bottom: 18px;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 15px 35px rgba(0,0,0,0.32);
    break-inside: avoid;
}

.photo-card:hover {
    transform: translateY(-4px);
    border-color: rgba(255,116,20,0.55);
    box-shadow: 0 20px 45px rgba(0,0,0,0.42);
}

.photo-card img {
    width: 100%;
    height: auto;
    display: block;
    pointer-events: none;
}

.photo-caption {
    padding: 14px 16px;
    font-size: 0.9rem;
    color: #e5e7eb;
    text-align: center;
    background: rgba(15, 15, 15, 0.95);
    font-weight: 700;
    border-top: 1px solid rgba(255,255,255,0.06);
}


/* =========================================================
   LIGHTBOX MODAL
========================================================= */

.lightbox {
    display: none;
    position: fixed;
    z-index: 9999;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(10, 10, 10, 0.96);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    justify-content: center;
    align-items: center;
    flex-direction: column;
    padding: 20px;
}

.lightbox-img {
    max-width: 90%;
    max-height: 80vh;
    border-radius: 12px;
    border: 2px solid #ff7414;
    box-shadow: 0 0 40px rgba(255,116,20,0.35);
    object-fit: contain;
    pointer-events: none;
}

.lightbox-caption {
    margin-top: 18px;
    color: #ffffff;
    font-size: 1rem;
    font-weight: 700;
    text-align: center;
}

.lightbox-close {
    position: absolute;
    top: 25px; right: 30px;
    color: #ff7414;
    font-size: 40px;
    cursor: pointer;
    transition: 0.2s ease;
}

.lightbox-close:hover {
    color: #ffffff;
}


/* =========================================================
   BACK BUTTON
========================================================= */

.back-btn {
    display: block;
    width: 100%;
    text-align: center;
    padding: 17px 20px;

    background:
        linear-gradient(
            145deg,
            #242424 0%,
            #191919 100%
        );

    border: 1px solid rgba(255,116,20,0.55);
    border-radius: 12px;

    color: #ff7414;
    text-decoration: none;

    font-weight: 800;
    font-size: 0.95rem;
    letter-spacing: 0.5px;

    box-shadow: 0 10px 25px rgba(0,0,0,0.32);
    transition: 0.3s ease;
}

.back-btn:hover {
    transform: translateY(-2px);
    background: #ff7414;
    color: #ffffff;
    box-shadow: 0 15px 30px rgba(255,116,20,0.35);
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media screen and (max-width: 600px) {
    .container {
        padding: 15px 12px 40px;
    }

    .gallery-title {
        font-size: 1.5rem;
        margin-bottom: 25px;
    }

    .photo-card {
        border-radius: 14px;
    }

    .photo-caption {
        padding: 12px;
        font-size: 0.85rem;
    }

    .back-btn {
        font-size: 0.85rem;
        padding: 15px;
    }
}

</style>
</head>
<body oncontextmenu="return false;">

    <div class="container">

        <h1 class="gallery-title">Portfolio <span>Gallery</span></h1>

        <div class="gallery-grid" id="gallery-container">
            <p style="text-align:center; width:100%; color: #ff7414; padding: 40px 0;">Loading Gallery...</p>
        </div>

        <a href="index.html" class="back-btn">
            ← BACK TO HOME
        </a>

    </div>

    <div id="lightbox" class="lightbox" onclick="closeLightbox()">
        <span class="lightbox-close">&times;</span>
        <img id="lightbox-img" class="lightbox-img" src="" alt="Full View">
        <div id="lightbox-caption" class="lightbox-caption"></div>
    </div>

    <script>
        const API_KEY = 'AIzaSyCbmu7zMzWO4CYID7oetFmdrXuVA4PbUHM'; 
        const TARGET_FOLDER_ID = '1jfLl4PG4xT1jIv25fMvWY3HH32PYNudr'; 

        document.addEventListener('keydown', function(e) {
            if (e.key === 'PrintScreen') navigator.clipboard.writeText('');
            if (e.ctrlKey && (e.key === 'p' || e.key === 's' || e.key === 'u' || e.key === 'i')) e.preventDefault();
        });

        function getCleanCaption(fileName) {
            let nameWithoutExt = fileName.substring(0, fileName.lastIndexOf('.')) || fileName;
            let cleanText = nameWithoutExt.replace(/^[0-9]+[\s\-_.]*/, '').trim();
            return cleanText;
        }

        async function loadDrivePhotos() {
            const container = document.getElementById('gallery-container');
            const query = `'${TARGET_FOLDER_ID}' in parents and mimeType contains 'image/' and trashed = false`;
            
            const timestamp = new Date().getTime();
            const url = `https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(query)}&orderBy=name&key=${API_KEY}&fields=files(id,name,description)&pageSize=100&_=${timestamp}`;

            try {
                const res = await fetch(url, { cache: 'no-store' });
                const data = await res.json();
                container.innerHTML = '';

                if (data.files && data.files.length > 0) {
                    data.files.forEach(file => {
                        const imgUrl = `https://lh3.googleusercontent.com/d/${file.id}`;
                        const caption = file.description ? file.description : getCleanCaption(file.name);

                        const card = document.createElement('div');
                        card.className = 'photo-card';
                        card.onclick = () => openLightbox(imgUrl, caption);
                        card.innerHTML = `
                            <img src="${imgUrl}" alt="${file.name}" loading="lazy" ondragstart="return false;">
                            ${caption ? `<div class="photo-caption">${caption}</div>` : ''}
                        `;
                        container.appendChild(card);
                    });
                } else {
                    container.innerHTML = '<p style="text-align:center; width:100%; color: #9ca3af; padding: 40px 0;">No photos found!</p>';
                }
            } catch (err) {
                console.error(err);
                container.innerHTML = '<p style="text-align:center; width:100%; color: #ef4444; padding: 40px 0;">Error loading photos.</p>';
            }
        }

        function openLightbox(src, caption) {
            document.getElementById('lightbox-img').src = src;
            document.getElementById('lightbox-caption').innerText = caption;
            document.getElementById('lightbox').style.display = 'flex';
        }

        function closeLightbox() {
            document.getElementById('lightbox').style.display = 'none';
        }

        loadDrivePhotos();
    </script>
</body>
</html>

```
