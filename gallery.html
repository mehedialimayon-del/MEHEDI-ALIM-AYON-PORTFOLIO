        .gallery-img { width: 100%; height: 200px; object-fit: cover; border-radius: 10px; cursor: pointer; border: 2px solid #ff7414; }
        #modal { display: none; position: fixed; z-index: 9999; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); align-items: center; justify-content: center; }
        #modal img { max-width: 95vw; max-height: 90vh; object-fit: contain; border-radius: 5px; }
    </style>
</head>
