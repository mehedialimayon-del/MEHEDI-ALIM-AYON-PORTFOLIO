<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio Gallery</title>
  <style>
    body {
      background-color: #0b132b;
      color: #ffffff;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #ff6600;
      margin-top: 10px;
      margin-bottom: 25px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* ফিল্টার বাটন সমূহের কন্টেইনার */
    .filter-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-bottom: 30px;
    }

    .filter-btn {
      background-color: #1c2541;
      border: 2px solid #ff6600;
      color: #ffffff;
      padding: 10px 20px;
      border-radius: 25px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
      transition: all 0.3s ease;
      outline: none;
    }

    .filter-btn:hover, .filter-btn.active {
      background-color: #ff6600;
      color: #ffffff;
      box-shadow: 0 0 10px rgba(255, 102, 0, 0.5);
    }

    /* গ্যালারি গ্রিড লেআউট */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      padding: 10px;
    }

    .gallery-card {
      background-color: #1c2541;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      transition: transform 0.3s ease;
    }

    .gallery-card:hover {
      transform: translateY(-5px);
    }

    .gallery-card img {
      width: 100%;
      height: 260px;
      object-fit: cover;
      display: block;
    }

    .status-msg {
      text-align: center;
      width: 100%;
      font-size: 16px;
      color: #a0aec0;
      grid-column: 1 / -1;
      padding: 40px 0;
    }
  </style>
</head>
<body>

  <h1>PORTFOLIO GALLERY</h1>

  <!-- ক্যাটাগরি ফিল্টার বাটন সমূহ -->
  <div class="filter-container">
    <button class="filter-btn active" onclick="loadDrivePhotos('1luVo0biysCP81PwVgPj1HMSanEWJjKF3', this)">PRAN GROUP MALAYSIA</button>
    <button class="filter-btn" onclick="loadDrivePhotos('1_b4DW79bCQwzTlDoDiPsfTquRyc0ZfI7', this)">ECO EXPO</button>
    <button class="filter-btn" onclick="loadDrivePhotos('1fWtIlzVzsFLduSDAqIYVunQJkk7JmJ27', this)">ACADEMIC</button>
    <button class="filter-btn" onclick="loadDrivePhotos('1l6U7PdXmhRQYIa03nMlMWU86HewGkaDv', this)">FAMILY</button>
    <button class="filter-btn" onclick="loadDrivePhotos('1SfoC1ZilQlpFbdKrpYQhSu3_lyngpqqf', this)">MYSELF</button>
  </div>

  <!-- ছবি দেখানোর কন্টেইনার -->
  <div id="gallery" class="gallery-grid">
    <div class="status-msg">ছবি লোড হচ্ছে...</div>
  </div>

  <script>
    // আপনার গুগল ড্রাইভ এপিআই কি (API Key) এখানে বসান
    const API_KEY = 'YOUR_GOOGLE_DRIVE_API_KEY'; 

    async function loadDrivePhotos(folderId, btnElement) {
      // অ্যাক্টিভ বাটনের স্টাইল চেঞ্জ করা
      if (btnElement) {
        document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
        btnElement.classList.add('active');
      }

      const gallery = document.getElementById('gallery');
      gallery.innerHTML = '<div class="status-msg">ছবি লোড হচ্ছে...</div>';

      // গুগল ড্রাইভ থেকে নির্দিষ্ট ফোল্ডারের ফাইল আনার URL
      const url = `https://www.googleapis.com/drive/v3/files?q='${folderId}'+in+parents+and+trashed=false&fields=files(id,name,mimeType)&key=${API_KEY}`;

      try {
        const response = await fetch(url);
        const data = await response.json();

        gallery.innerHTML = ''; // আগের ছবি ক্লিয়ার করা

        if (data.files && data.files.length > 0) {
          // শুধু ইমেজ ফাইলগুলো ফিল্টার করা
          const imageFiles = data.files.filter(file => file.mimeType.startsWith('image/'));

          if (imageFiles.length > 0) {
            imageFiles.forEach(file => {
              const card = document.createElement('div');
              card.className = 'gallery-card';

              const img = document.createElement('img');
              img.src = `https://lh3.googleusercontent.com/d/${file.id}`;
              img.alt = file.name;
              img.loading = 'lazy';

              card.appendChild(img);
              gallery.appendChild(card);
            });
          } else {
            gallery.innerHTML = '<div class="status-msg">এই ফোল্ডারে কোনো ছবি পাওয়া যায়নি।</div>';
          }
        } else {
          gallery.innerHTML = '<div class="status-msg">এই ফোল্ডারে কোনো ছবি পাওয়া যায়নি।</div>';
        }
      } catch (error) {
        gallery.innerHTML = '<div class="status-msg">ছবি লোড করতে সমস্যা হয়েছে। অনুগ্রহ করে এপিআই কি (API Key) চেক করুন।</div>';
        console.error("Error fetching images:", error);
      }
    }

    // পেজ লোড হওয়ার পর ডিফল্টভাবে PRAN GROUP MALAYSIA ফোল্ডারের ছবি দেখাবে
    window.onload = () => {
      loadDrivePhotos('1luVo0biysCP81PwVgPj1HMSanEWJjKF3');
    };
  </script>

</body>
</html>
