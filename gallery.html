    <title>Gallery - Mehedi Alim Ayon</title>
    <style>
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; padding: 20px; max-width: 1000px; margin: 0 auto; }
        .gallery-img { width: 100%; border-radius: 12px; cursor: pointer; transition: 0.3s; border: 2px solid #ff7414; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .gallery-img:hover { transform: scale(1.03); filter: brightness(1.1); }
        #modal { display: none; position: fixed; z-index: 1000; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); align-items: center; justify-content: center; }
        #modal img { max-width: 90%; max-height: 90%; border-radius: 10px; box-shadow: 0 0 25px rgba(255,116,20,0.5); }
    </style>
</head>
